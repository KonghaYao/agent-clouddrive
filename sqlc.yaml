version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/000001_initial.up.sql"
      - "db/migrations/000002_invariants.up.sql"
      - "db/migrations/000003_runtime.up.sql"
      - "db/migrations/000004_reviewers.up.sql"
      - "db/migrations/000005_delegation.up.sql"
      - "db/migrations/000006_identity_state.up.sql"
      - "db/migrations/000007_share_lifecycle.up.sql"
      - "db/migrations/000008_audit_reads.up.sql"
      - "db/migrations/000012_read_cursor_binding.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true
