user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  # No request access log anywhere; feedback paths must not be correlated.
  # Do not enable CDN/APM/request recording on these paths upstream either.
  access_log off;
  error_log /dev/null crit;
  client_max_body_size 20g;
  client_body_timeout 3600s;
  keepalive_timeout 65;
  # 仅明确配置的代理地址可声明协议；默认不信任任何转发头。
  geo $identity_trusted_proxy {
    default 0;
    # __TRUSTED_IDENTITY_PROXIES__
  }
  map "$scheme:$identity_trusted_proxy:$http_x_forwarded_proto" $identity_scheme {
    default $scheme;
    "http:1:https" https;
  }
  # 只有 setup --development-http 生成的本机入口允许移除 Secure。
  map "$identity_scheme:$host" $identity_cookie_secure {
    default "secure";
    # __DEVELOPMENT_COOKIE_SECURE__
  }
  map "$identity_scheme:$host" $identity_cookie_samesite {
    default "";
    # __DEVELOPMENT_COOKIE_SAMESITE__
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz { return 200 'ok'; }
    location = /config.json { add_header Cache-Control 'no-store'; try_files $uri =404; }
    location ^~ /internal/ { return 404; }
    location ^~ /identity/ {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $identity_scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_cookie_flags ~ $identity_cookie_secure $identity_cookie_samesite;
    }
    location = /v1/feedback {
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://api:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For '';
      proxy_set_header X-Real-IP '';
      proxy_set_header X-Request-ID '';
      proxy_set_header Traceparent '';
      proxy_set_header Tracestate '';
      proxy_set_header Baggage '';
      proxy_set_header Referer '';
      proxy_set_header User-Agent '';
      proxy_set_header Cookie '';
    }
    # MCP is beta and internal-only. Do not expose it on the public gateway.
    # Beta access uses the internal listener at api:8081/mcp.
    location /mcp {
      return 404;
    }
    location ^~ /.well-known/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
    location ^~ /v1/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection '';
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location ^~ /tus/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection '';
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location ^~ /s/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; proxy_buffering off; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
