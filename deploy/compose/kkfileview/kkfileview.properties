# Additional configuration for pinned kkFileView 5.0.3. Not a public web app.
server.port=8012
file.dir=/data/previews/
local.preview.dir=default
trust.host=preview
not.trust.host=default
file.upload.disable=true
kk.scriptjs=false
kk.Getcorsfile=false
kk.addTask=false
kk.PicturesPreview=false
delete.password=false
delete.source.file=true
cache.enabled=true
cache.type=jdk
office.preview.type=pdf
office.type.web=image
office.preview.switch.disabled=true
office.plugin.task.timeout=5m
office.plugin.task.taskexecutiontimeout=5m
pdf.download.disable=true
pdf.print.disable=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=ERROR
logging.level.cn.keking=OFF
server.tomcat.accesslog.enabled=false
